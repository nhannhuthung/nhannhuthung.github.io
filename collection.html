<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />

    <title>Nhan Nhựt Hưng</title>
    
    <meta name="og:title" content="Nhan Nhựt Hưng">
    <meta name="og:image" content="https://nhannhuthung.github.io/images/logo/icon.png">
    <meta name="og:description" content="Welcome to my website! You can check out my money collection around the world.">
    <meta name="keywords" content="Nhan Nhựt Hưng, Nhan Nhut Hung, Nhựt Hưng Nhan, Nhut Hung Nhan, Hưng Nhựt Nhan, Hung Nhut Nhan, Howl, Howl Nhan, Harry, Harry Nhan, H Nhan">
    <meta name="description" content="Nhan Nhựt Hưng">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="128x128" href="images/logo/icon.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/collection.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- set the theme before first paint so there is no flash of the wrong one -->
    <script>
        document.documentElement.setAttribute(
            "data-theme", localStorage.getItem("theme") || "light");
    </script>

    <script charset="utf-8" src="script.js" defer></script>
    <script src="scripts/collection-value.js" defer></script>
    <script src="scripts/lang/collection.js" defer></script>
</head>

<body>
    <div class="preloader"></div>
    <header>
        <div class="header-container">
            <div class="left-group">
                <a href="javascript:void(0);" class="hamburger-nav" onclick="toggleMenu()">
                    <i class="fa fa-bars"></i> <strong>MENU</strong>
                </a>

                <nav id="header-nav">
                    <a href="index.html" id="home-nav" data-i18n="home"></a>
                    <a href="collection.html" id="collection-nav" data-i18n="collection"></a>
                    <a href="about.html" id="about-nav" data-i18n="about"></a>
                    <a href="contact.html" id="contact-nav" data-i18n="contact"></a>
                </nav>
            </div>

            <div class="right-group">
                <div class="language-toggle">
                    <a href="javascript:void(0);" onclick="toggleLanguage()">Eng | Vie</a>
                </div>

                <button type="button" id="theme-toggle" class="theme-toggle"
                        onclick="toggleTheme()" aria-label="Switch light/dark theme"></button>

                <div class="search-container">
                    <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="">
                    <button type="button" class="search-button" onclick="toggleSearch(event)" aria-label="Search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <div id="suggestions" class="suggestions-box"></div>
                </div>
            </div>
        </div>
    </header>

    <button onclick="toTop()" id="top_btn" data-i18n="top_btn" data-i18n-title="top_title"></button>

    <!-- Region navigator: built by buildRegionNav() in scripts/lang/collection.js -->
    <div id="country-list"></div>

    <div class="container-top">
        <h2 id="acknowledge" data-i18n="acknowledge" style="margin-top: 10px;"></h2>
        <p id="acknowledge-para" data-i18n="acknowledge_para"></p>
        <h2 id="remark" data-i18n="remark"></h2>
        <p id="remark-para-1" data-i18n="remark_para_1"></p>
        <p id="remark-para-2" data-i18n="remark_para_2"></p>
        <ul>
            <!--customize the bullet here
            https://www.toptal.com/designers/htmlarrows/symbols/-->
            <li id="remark-subpara-1" data-i18n="remark_subpara_1"></li>
            <li id="remark-subpara-2" data-i18n="remark_subpara_2"></li>
        </ul>
        <p id="remark-para-3" data-i18n="remark_para_3"></p>

        <!-- Total USD face value of circulating banknotes.
             Data comes from scripts/collection-value.js (regenerate with
             tools/generate-collection-value.ps1); rates are fetched live. -->
        <div id="collection-value" class="collection-value"></div>

        <h4 id="last-update" data-i18n="last_update"></h4>

        <h2 id="highlight" data-i18n="highlight"></h2>

        <h3 id="banknote" data-i18n="banknote"></h3>
        <!-- Each tile is a square corner-crop of a banknote motif.
             To add/change a tile: set src to your snipped square image, and edit
             the matching hl_* caption (en + vi) in scripts/lang/collection.js. -->
        <div class="highlight-banknote">
            <div class="hl-tile">
                <img src="images/highlight/banknote/fruit&flower.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_1"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/banana.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_2"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/butterfly.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_3"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/train.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_4"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/sunflower.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_5"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/ship.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_6"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/axolotl.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_7"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/turtle.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_8"></div>
            </div>
            <div class="hl-tile">
                <img src="images/highlight/banknote/rock.jpg" alt="">
                <div class="hl-caption" data-i18n="hl_9"></div>
            </div>
        </div>

        <h3 id="coin" data-i18n="coin"></h3>
        <div class="highlight-coin">
            <div class="coin-box" data-info="USA ~ 1881-O ~ 1 Dollar">
                <div class="coin-imgs">
                    <img src="images/highlight/coin/usa-f.jpg" alt="1 Dollar Front">
                    <img src="images/highlight/coin/usa-b.jpg" alt="1 Dollar Back">
                </div>
                <div id="usa-coin" data-i18n="usa_coin" class="coin-overlay"></div>
            </div>
            <div class="coin-box" data-info="Indochinese Union ~ 1902 ~ 1 Piastre">
                <div class="coin-imgs">
                    <img src="images/highlight/coin/indochina-f.jpg" alt="1 Piastre Front">
                    <img src="images/highlight/coin/indochina-b.jpg" alt="1 Piastre Back">
                </div>
                <div id="indochina-coin" data-i18n="indochina_coin" class="coin-overlay"></div>
            </div>
            <div class="coin-box" data-info="Canada ~ 1967 ~ 1 Dollar">
                <div class="coin-imgs">
                    <img src="images/highlight/coin/canada-f.jpg" alt="1 Dollar Front">
                    <img src="images/highlight/coin/canada-b.jpg" alt="1 Dollar Back">
                </div>
                <div id="canada-coin" data-i18n="canada_coin" class="coin-overlay"></div>
            </div>
        </div>
    </div>

    <footer>

    </footer>
    <script src="scripts/loading.js"></script>
</body>

</html>
