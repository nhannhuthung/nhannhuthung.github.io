<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />

    <title>Nhan Nhựt Hưng</title>
    
    <meta name="og:title" content="Nhan Nhựt Hưng">
    <meta name="og:image" content="https://nhannhuthung.github.io/images/logo/icon.png">
    <meta name="og:description" content="Welcome to my website! You can check out my money collection around the world.">
    <meta name="keywords" content="Nhan Nhựt Hưng, Nhan Nhut Hung, Nhut Hung Nhan, Hung Nhut Nhan, Howl, Howl Nhan, Harry, Harry Nhan">
    <meta name="description" content="Nhan Nhựt Hưng">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="128x128" href="images/logo/icon.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/collection.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script charset="utf-8" src="script.js" defer></script>
    <script src="scripts/lang/collection.js" defer></script>
</head>

<body>
    <div class="preloader"></div>
    <header>
        <div class="header-container">
            <div class="left-group">
                <a href="javascript:void(0);" class="hamburger-nav" onclick="toggleMenu()">
                    <i class="fa fa-bars"></i> <strong>MENU</strong>
                </a>

                <nav id="header-nav">
                    <a href="index.html" id="home-nav" data-i18n="home"></a>
                    <a href="collection.html" id="collection-nav" data-i18n="collection"></a>
                    <a href="about.html" id="about-nav" data-i18n="about"></a>
                    <a href="contact.html" id="contact-nav" data-i18n="contact"></a>
                </nav>
            </div>

            <div class="right-group">
                <div class="language-toggle">
                    <a href="javascript:void(0);" onclick="toggleLanguage()">Eng | Vie</a>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="">
                    <button type="button" class="search-button" onclick="toggleSearch(event)" aria-label="Search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <div id="suggestions" class="suggestions-box"></div>
                </div>
            </div>
        </div>
    </header>

    <button onclick="toTop()" id="top_btn" data-i18n="top_btn" data-i18n-title="top_title"></button>

    <div class="container-top">
        <h3 id="acknowledge" data-i18n="acknowledge" style="margin-top: 10px;"></h3>
        <p id="acknowledge-para" data-i18n="acknowledge_para"></p>
        <h3 id="remark" data-i18n="remark"></h3>
        <p id="remark-para-1" data-i18n="remark_para_1"></p>
        <p id="remark-para-2" data-i18n="remark_para_2"></p>
        <ul>
            <!--customize the bullet here
            https://www.toptal.com/designers/htmlarrows/symbols/-->
            <li id="remark-subpara-1" data-i18n="remark_subpara_1"></li>
            <li id="remark-subpara-2" data-i18n="remark_subpara_2"></li>
        </ul>
        <p id="remark-para-3" data-i18n="remark_para_3"></p>
        <br>
        <h4 id="last-update" data-i18n="last_update" style="text-align: right;"></h4>
        <h5 style="text-align: right;">??/??/2026</h5>
    </div>

    <div class="container-highlight">
        <h1 id="highlight" data-i18n="highlight" style="color: whitesmoke;"></h1>

        <h2 id="banknote" data-i18n="banknote" style="color: whitesmoke;"></h2>
        <div class="highlight-banknote">
            <div class="box" id="box-1">
                <img src="images/highlight/banknote/mexico.jpg" alt="Mexico">
                <div class="overlay">Mexico</div>
            </div>
            <div class="box" id="box-2">
                <img src="images/collection/norway/8/200-krone-f.jpg" alt="Norway">
                <div id="norway" data-i18n="norway" class="overlay"></div>
            </div>
            <div class="box" id="box-3">
                <img src="images/highlight/banknote/hong-kong.jpg" alt="Hong Kong">
                <div id="hong-kong" data-i18n="hong_kong" class="overlay"></div>
            </div>
            <div class="box" id="box-4">
                <img src="images/collection/australia/1988/10-dollar-b.jpg" alt="Australia">
                <div id="australia" data-i18n="australia" class="overlay"></div>
            </div>
            <div class="box" id="box-5">
                <img src="images/collection/venezuela/2008/5-bolivar-b.jpg" alt="Hong Kong">
                <div class="overlay">Venezuela</div>
            </div>
            <div class="box" id="box-6">
                <img src="images/collection/rwanda/2013/5000-franc-f.jpg" alt="Rwanda">
                <div class="overlay">Rwanda</div>
            </div>
            <div class="box" id="box-7">
                <img src="images/collection/costa-rica/2018-2019/1000-colon-b.jpg" alt="France">
                <div class="overlay">Costa Rica</div>
            </div>
        </div>

        <h2 id="coin" data-i18n="coin" style="color: whitesmoke;"></h2>
        <div class="highlight-coin">
            <div class="coin-box" data-info="USA ~ 1881-O ~ 1 Dollar">
                <img src="images/highlight/coin/usa-f.jpg" alt="1 Dollar Front">
                <img src="images/highlight/coin/usa-b.jpg" alt="1 Dollar Back">
                <div id="usa-coin" data-i18n="usa_coin" class="coin-overlay"></div>
            </div>
            <div class="coin-box" data-info="Indochinese Union ~ 1902 ~ 1 Piastre">
                <img src="images/highlight/coin/indochina-f.jpg" alt="1 Piastre Front">
                <img src="images/highlight/coin/indochina-b.jpg" alt="1 Piastre Back">
                <div id="indochina-coin" data-i18n="indochina_coin" class="coin-overlay"></div>
            </div>
            <div class="coin-box" data-info="Canada ~ 1967 ~ 1 Dollar">
                <img src="images/highlight/coin/canada-f.jpg" alt="1 Dollar Front">
                <img src="images/highlight/coin/canada-b.jpg" alt="1 Dollar Back">
                <div id="canada-coin" data-i18n="canada_coin" class="coin-overlay"></div>
            </div>
        </div>
    </div>

    <div id="country-list"></div>
    
    <footer>

    </footer>
    <script src="scripts/loading.js"></script>
</body>

</html>
