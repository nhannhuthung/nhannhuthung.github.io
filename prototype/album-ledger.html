<!DOCTYPE html>
<!-- Layout prototype: the ledger (E) as the compact view, each row opening
     into an album sleeve (A). Reads the real data/<country>.js files.
     Open it in a browser; it is not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Album Ledger Prototype</title>
<style>
/* Layout: one list; every banknote is a compact ledger row that unfolds
   into an album sleeve. Colours and fonts are the site's theme.css tokens. */
:root {
    --paper: #f2ece0;
    --sheet: #fbf7ef;
    --mat: #eae2d3;
    --ink: #2b2620;
    --ink-soft: #6d6154;
    --rule: #d8ccb7;
    --shadow: rgba(74, 58, 36, 0.13);
    --accent: #c0392b;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-body: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --paper: #15171b; --sheet: #1c1f25; --mat: #23272e; --ink: #e9e6e0;
        --ink-soft: #9b958a; --rule: #343942; --shadow: rgba(0, 0, 0, 0.55);
        --accent: #ff6b6b; color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --paper: #15171b; --sheet: #1c1f25; --mat: #23272e; --ink: #e9e6e0;
    --ink-soft: #9b958a; --rule: #343942; --shadow: rgba(0, 0, 0, 0.55);
    --accent: #ff6b6b; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- top bar ---- */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
.top h1 { font-size: clamp(30px, 5vw, 40px); line-height: 1.1; text-align: left; }
.count { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; padding: 6px 14px; font-size: 14px; background: var(--sheet); color: var(--ink-soft); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tool {
    font-size: 14px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--sheet); color: var(--ink); cursor: pointer;
}
select.tool { padding-right: 8px; max-width: 14rem; }

/* ---- the list ---- */
.notes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-soft); }

/* one grid shared by the column header and every row, so columns line up */
.cols {
    display: grid;
    grid-template-columns: 3.2rem 196px minmax(0, 1fr) 5rem minmax(0, 12rem) 8.5rem 1.2rem;
    gap: 14px;
    align-items: center;
}
.head {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);
    padding: 0 10px 8px;
}
.note { border-bottom: 1px solid var(--rule); }
.row { padding: 8px 10px; cursor: pointer; transition: background 0.15s ease; }
.row:hover, .note.open .row { background: var(--sheet); }
.num { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px; }
.minis { display: flex; gap: 4px; }
.mini {
    position: relative; width: 96px; aspect-ratio: 720 / 324; flex: none;
    background: var(--mat); border-radius: 2px; overflow: hidden;
}
.mini img { width: 100%; height: 100%; object-fit: cover; }
.more {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 13px;
}
.name { min-width: 0; display: grid; gap: 2px; }
.toggle {
    all: unset; cursor: pointer; font-family: var(--font-display); font-size: 17px; line-height: 1.25;
    display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline;
}
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.who { font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.facts { display: contents; }
.year { font-variant-numeric: tabular-nums; }
.year.missing { color: var(--ink-soft); }
.type { font-size: 14px; color: var(--ink-soft); }
.ref { font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chev { color: var(--ink-soft); font-size: 12px; transition: transform 0.2s ease; justify-self: end; }
.note.open .chev { transform: rotate(90deg); }
.new {
    font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--sheet); background: var(--accent); padding: 1px 6px; border-radius: 3px;
}
.custom-link { color: var(--accent); }

/* group breaks from the `layout` line: "|" solid, ":" dashed */
.break { height: 0; border-top: 2px solid var(--ink-soft); margin-top: -1px; }
.break.dashed { border-top-style: dashed; }

/* ---- the album sleeve a row opens into ---- */
.sleeve { background: var(--sheet); padding: 6px 10px 28px; display: grid; gap: 16px; }
.pair {
    display: grid; gap: 16px; justify-content: center;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 460px));
}
.pair figure { margin: 0; min-width: 0; }
.matted { background: var(--mat); padding: 8px; border-radius: 2px; }
.side {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-soft); margin-top: 6px;
}
.label { display: grid; gap: 4px; justify-items: center; text-align: center; max-width: 64ch; margin: 0 auto; }
.label .meta { font-size: 14px; color: var(--ink-soft); }
.label .remark { font-style: italic; color: var(--ink-soft); font-size: 14px; }
.label .k { color: var(--ink-soft); }
.rainbow-text {
    background: linear-gradient(to right, #e53935, #fb8c00, #fdd835, #43a047, #1e88e5, #8e24aa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sleeve[hidden] { display: none; }

.foot { color: var(--ink-soft); font-size: 13px; }
.error { padding: 24px; border: 1px dashed var(--rule); border-radius: 6px; color: var(--ink-soft); }

/* ---- phones: the row stacks, the facts become one line ---- */
@media (max-width: 760px) {
    .head { display: none; }
    .row.cols {
        grid-template-columns: 2.2rem minmax(0, 1fr) 1rem;
        grid-template-areas: "num minis chev" "num name chev" "num facts chev";
        gap: 6px 10px; align-items: start;
    }
    .row .num { grid-area: num; padding-top: 2px; }
    .row .minis { grid-area: minis; }
    .row .name { grid-area: name; }
    .row .chev { grid-area: chev; align-self: center; }
    .facts { grid-area: facts; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
    .facts > * { font-size: 13px; }
    .mini { width: calc(50% - 2px); }
    .minis { width: 100%; max-width: 300px; }
    .pair { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
    .row, .chev { transition: none; }
}
</style>
<script src="../scripts/regions.js"></script>
<script>
    // data files call this for their `reference` field (the site defines it
    // in scripts/collection-item.js, which this prototype does not load)
    function refLink(code, url) {
        return `<a href="${url}" target="_blank" rel="noopener" class="custom-link">${code}</a>`;
    }
</script>
</head>
<body>
<main>
    <header class="top">
        <div>
            <h1 id="heading">Loading…</h1>
            <p class="count" id="count"></p>
        </div>
        <div class="tools">
            <div class="seg" role="group" aria-label="View">
                <button type="button" id="view-compact" aria-pressed="true">Compact</button>
                <button type="button" id="view-album" aria-pressed="false">Album</button>
            </div>
            <select class="tool" id="country" aria-label="Country"></select>
            <button type="button" class="tool" id="lang-btn">Tiếng Việt</button>
            <button type="button" class="tool" id="theme-btn">Dark theme</button>
        </div>
    </header>

    <div class="cols head" aria-hidden="true">
        <span id="h-no">No.</span><span id="h-photos">Photos</span><span id="h-note">Banknote</span>
        <span id="h-year">Year</span><span id="h-type">Type</span><span id="h-ref">Reference</span><span></span>
    </div>
    <ol class="notes" id="notes"></ol>

    <p class="foot" id="foot"></p>
</main>

<script>
// Wrapped in its own scope: the data file adds its consts (images, issuer...)
// to the shared global scope, and a clash with a name here would stop it loading.
(() => {
const LABELS = {
    en: {
        issuer: "Issuer", year: "Year", type: "Type", figure: "Figure", size: "Dimension",
        reference: "Reference", compact: "Compact", album: "Album", notes: "banknotes",
        no: "No.", photos: "Photos", note: "Banknote", other: "Tiếng Việt",
        dark: "Dark theme", light: "Light theme", newTag: "NEW",
        foot: "Prototype. Reads data/{slug}.js directly, so it shows exactly what the country page has.",
        missing: "There is no data/{slug}.js to read.",
    },
    vi: {
        issuer: "Đơn Vị Phát Hành", year: "Năm", type: "Loại", figure: "Vĩ Nhân", size: "Kích Thước",
        reference: "Mã Tham Chiếu", compact: "Gọn", album: "Album", notes: "tờ tiền",
        no: "Số", photos: "Ảnh", note: "Tờ tiền", other: "English",
        dark: "Giao diện tối", light: "Giao diện sáng", newTag: "MỚI",
        foot: "Bản thử nghiệm. Đọc trực tiếp data/{slug}.js nên hiển thị đúng như trang của quốc gia.",
        missing: "Không có tệp data/{slug}.js.",
    },
};

const store = {
    get(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private window */ } },
};

const slug = decodeURIComponent(location.hash.slice(1)) || "canada";
let lang = store.get("language", "en") === "vi" ? "vi" : "en";
let view = store.get("noteView", "compact");
const open = new Set();
const L = key => LABELS[lang][key];

// a field is either plain text or { en, vi }
function text(value) {
    if (value === null || value === undefined) return "";
    if (typeof value === "object" && !Array.isArray(value)) return value[lang] || value.en || "";
    return String(value);
}

// same order rules as buildSlots() on the real page
function noteOrder() {
    const tokens = (typeof layout === "string" ? layout : "").split(/\s+/).filter(Boolean);
    const listed = new Set(tokens.map(Number));
    const missing = [];
    for (let i = images.length - 1; i >= 1; i--) if (!listed.has(i)) missing.push(String(i));
    const placed = new Set();
    return missing.concat(tokens).filter(t => {
        if (t === "|" || t === ":") return true;
        const n = Number(t);
        if (!images[n] || placed.has(n)) return false;
        placed.add(n);
        return true;
    });
}

function shortType(info) {
    const full = text(info.type);
    return lang === "en" ? full.replace(/ Banknote$/, "") : full;
}

function rowHTML(n) {
    const info = slideshowInfo[n] || {};
    const pics = images[n] || [];
    const figures = Array.isArray(info.figure) ? info.figure : null;
    const who = figures ? text(figures[0]) : text(info.figure);
    const year = text(info.year);

    const minis = pics.slice(0, 2).map((p, i) => `
        <span class="mini"><img src="${p.src}" alt="" loading="lazy">${
            i === 1 && pics.length > 2 ? `<span class="more">+${pics.length - 2}</span>` : ""}</span>`).join("");

    const figuresHTML = pics.map((p, i) => `
        <figure>
            <div class="matted"><img src="${p.src}" alt="${text(p.alt)}" loading="lazy"></div>
            <figcaption class="side">${text(p.description)}${figures && figures[i] ? ` · ${text(figures[i])}` : ""}</figcaption>
        </figure>`).join("");

    const meta = [text(info.issuer), text(info.type), text(info.size)].filter(Boolean).join(" · ");
    const isOpen = open.has(n);

    return `
    <li class="note${isOpen ? " open" : ""}" data-n="${n}">
        <div class="row cols">
            <span class="num">#${n}</span>
            <span class="minis">${minis}</span>
            <span class="name">
                <button type="button" class="toggle" aria-expanded="${isOpen}" aria-controls="sleeve-${n}">
                    ${text(info.title)}${info.new ? `<span class="new">${L("newTag")}</span>` : ""}
                </button>
                ${who ? `<span class="who">${who}</span>` : ""}
            </span>
            <span class="facts">
                <span class="year${year ? "" : " missing"}">${year || "—"}</span>
                <span class="type">${shortType(info)}</span>
                <span class="ref">${info.reference ? text(info.reference) : ""}</span>
            </span>
            <span class="chev" aria-hidden="true">&#9654;</span>
        </div>
        <div class="sleeve" id="sleeve-${n}"${isOpen ? "" : " hidden"}>
            <div class="pair" style="--cols: ${Math.min(Math.max(pics.length, 1), 3)}">${figuresHTML}</div>
            <div class="label">
                ${meta ? `<p class="meta">${meta}</p>` : ""}
                ${!figures && who ? `<p><span class="k">${L("figure")}:</span> ${who}</p>` : ""}
                ${info.reference ? `<p><span class="k">${L("reference")}:</span> ${text(info.reference)}</p>` : ""}
                ${info.note ? `<p class="remark">${text(info.note)}</p>` : ""}
                ${info.special ? `<p class="remark rainbow-text">${text(info.special)}</p>` : ""}
            </div>
        </div>
    </li>`;
}

function render() {
    document.documentElement.lang = lang;
    const name = (typeof translations !== "undefined" && translations.heading)
        ? text(translations.heading)
        : (COUNTRIES[slug] ? COUNTRIES[slug][lang] : slug);
    document.getElementById("heading").textContent = name;
    document.title = `${name} · Album Ledger Prototype`;
    const total = images.length - 1;
    document.getElementById("count").textContent = `${total} ${L("notes")}`;

    ["no", "photos", "note", "year", "type", "ref"].forEach(k => {
        document.getElementById("h-" + k).textContent = L(k === "ref" ? "reference" : k);
    });
    document.getElementById("view-compact").textContent = L("compact");
    document.getElementById("view-album").textContent = L("album");
    document.getElementById("lang-btn").textContent = L("other");
    document.getElementById("foot").textContent = L("foot").replace("{slug}", slug);
    labelThemeButton();

    document.getElementById("notes").innerHTML = noteOrder().map(t =>
        t === "|" ? `<li class="break" aria-hidden="true"></li>`
        : t === ":" ? `<li class="break dashed" aria-hidden="true"></li>`
        : rowHTML(Number(t))
    ).join("");
}

function setOpen(li, isOpen) {
    const n = Number(li.dataset.n);
    isOpen ? open.add(n) : open.delete(n);
    li.classList.toggle("open", isOpen);
    li.querySelector(".toggle").setAttribute("aria-expanded", String(isOpen));
    li.querySelector(".sleeve").hidden = !isOpen;
}

function setView(next) {
    view = next;
    store.set("noteView", view);
    document.getElementById("view-compact").setAttribute("aria-pressed", String(view === "compact"));
    document.getElementById("view-album").setAttribute("aria-pressed", String(view === "album"));
    document.querySelectorAll(".note").forEach(li => setOpen(li, view === "album"));
}

// clicking anywhere on a row opens it, except on a link inside it
document.getElementById("notes").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const row = e.target.closest(".row");
    if (!row) return;
    const li = row.parentElement;
    setOpen(li, !li.classList.contains("open"));
});
document.getElementById("view-compact").addEventListener("click", () => setView("compact"));
document.getElementById("view-album").addEventListener("click", () => setView("album"));

document.getElementById("lang-btn").addEventListener("click", () => {
    lang = lang === "en" ? "vi" : "en";
    store.set("language", lang);
    fillCountryMenu();
    render();
});

// theme: starts from the system setting, the button overrides it
function currentTheme() {
    return document.documentElement.dataset.theme ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function labelThemeButton() {
    document.getElementById("theme-btn").textContent = currentTheme() === "dark" ? L("light") : L("dark");
}
document.getElementById("theme-btn").addEventListener("click", () => {
    document.documentElement.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
    labelThemeButton();
});

// country menu: a data file declares top-level consts, so switching country reloads the page
function fillCountryMenu() {
    const menu = document.getElementById("country");
    menu.innerHTML = Object.keys(COUNTRIES)
        .sort((a, b) => COUNTRIES[a][lang].localeCompare(COUNTRIES[b][lang]))
        .map(s => `<option value="${s}"${s === slug ? " selected" : ""}>${COUNTRIES[s][lang]}</option>`)
        .join("");
}
document.getElementById("country").addEventListener("change", e => { location.hash = e.target.value; });
window.addEventListener("hashchange", () => location.reload());

fillCountryMenu();
const dataScript = document.createElement("script");
dataScript.src = `../data/${slug}.js`;
dataScript.onload = () => {
    // compact view opens the newest note so both styles show at a glance
    const first = noteOrder().find(t => t !== "|" && t !== ":");
    if (view === "album") noteOrder().forEach(t => { if (t !== "|" && t !== ":") open.add(Number(t)); });
    else if (first) open.add(Number(first));
    render();
    setView(view === "album" ? "album" : "compact");
    if (view !== "album" && first) setOpen(document.querySelector(`.note[data-n="${first}"]`), true);
};
dataScript.onerror = () => {
    document.getElementById("heading").textContent = slug;
    document.getElementById("notes").outerHTML = `<p class="error">${L("missing").replace("{slug}", slug)}</p>`;
};
document.head.appendChild(dataScript);
})();
</script>
</body>
</html>
